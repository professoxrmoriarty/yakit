name: 2. Build and Release Yakit (English Edition)

on:
  push:
    tags:
      - 'v*-yakit-en'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Manual Release အတွက် Tag အမည် (ဥပမာ v1.3.5-yakit-en)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Yakit on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            build_flag: --win
          - os: ubuntu-latest
            platform: linux
            build_flag: --linux
          - os: macos-latest
            platform: mac
            build_flag: --mac

    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Setup Node.js & Yarn
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: 3. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. Enforce English Default Language (i18n Patch)
        shell: bash
        run: |
          I18N_FILE="app/renderer/src/main/src/i18n/i18n.ts"
          if [ -f "$I18N_FILE" ]; then
            sed -i.bak "s/lng:.*'zh'/lng: localStorage.getItem('i18nextLng') || 'en'/g" "$I18N_FILE"
            sed -i.bak "s/fallbackLng:.*'zh'/fallbackLng: 'en'/g" "$I18N_FILE"
            rm -f "${I18N_FILE}.bak"
            echo "Successfully patched i18n.ts to default to English."
          fi

      - name: 5. Install Linux Build Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-dev libgdk-pixbuf2.0-dev libgtk-3-dev libxss-dev libasound2-dev rpm

      - name: 6. Install Dependencies & Auto-Detect Build Script
        shell: bash
        run: |
          yarn config set network-timeout 300000
          yarn install --ignore-engines

          echo "=== Available scripts in package.json ==="
          node -e "console.log(Object.keys(require('./package.json').scripts || {}))"

          # package.json ထဲရှိ scripts များကို စစ်ဆေးပြီး ရှိသည့် build command ကို အလိုအလျောက် Run မည်
          PLATFORM="${{ matrix.platform }}"
          node - << 'EOF'
          const { execSync } = require('child_process');
          const pkg = require('./package.json');
          const scripts = pkg.scripts || {};
          const platform = process.env.PLATFORM;

          function run(cmd) {
            console.log(`>>> Running: ${cmd}`);
            execSync(cmd, { stdio: 'inherit' });
          }

          // 1. Frontend / Renderer Build စစ်ဆေးခြင်း
          const prebuildCandidates = ['build:renderer', 'build:web', 'build:front', 'compile', 'prepare-build'];
          for (const s of prebuildCandidates) {
            if (scripts[s]) {
              run(`yarn run ${s}`);
            }
          }

          // 2. Main / OS-specific Build စစ်ဆေးခြင်း
          const osScriptCandidates = [
            `build:${platform}`,
            `dist:${platform}`,
            `pack:${platform}`,
            `release:${platform}`,
            `electron:build:${platform}`,
            'build',
            'dist',
            'electron:build',
            'package'
          ];

          let executed = false;
          for (const s of osScriptCandidates) {
            if (scripts[s]) {
              run(`yarn run ${s}`);
              executed = true;
              break;
            }
          }

          if (!executed) {
            console.log("No specific build script matched in root package.json, proceeding to electron-builder step...");
          }
          EOF

      - name: 7. Package Electron Installers (Fallback if not already packaged)
        shell: bash
        run: |
          # အကယ်၍ Step 6 တွင် installer မထွက်သေးပါက electron-builder ဖြင့် တိုက်ရိုက်ထုတ်မည်
          if ! ls dist/*.exe dist/*.dmg dist/*.AppImage dist/*.deb dist/*.zip 1> /dev/null 2>&1; then
            echo "Running npx electron-builder ${{ matrix.build_flag }}..."
            npx electron-builder ${{ matrix.build_flag }} --publish never || true
          else
            echo "Installers already generated in dist/ folder!"
          fi

      - name: 8. Upload Build Artifacts (For Actions Storage)
        uses: actions/upload-artifact@v4
        with:
          name: Yakit-English-${{ matrix.platform }}
          path: |
            dist/*
            out/*
            release/*
            build/*.exe
            build/*.dmg
            build/*.AppImage
          if-no-files-found: ignore

      - name: 9. Publish to GitHub Releases (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.custom_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          name: "Yakit English Edition (${{ github.ref_name }})"
          body: |
            ### Yakit English Edition & Security Edition - ${{ github.ref_name }}
            * Default UI language set to **English (`en`)** out of the box.
            * Includes translated Security Glossary, PoC YAML templates, and .yak plugins.
            * Built automatically via GitHub Actions (Windows, Linux, macOS).
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            out/*.exe
            out/*.dmg
            release/*.exe
