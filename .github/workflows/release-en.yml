name: "2. Build & Release Yakit (English Edition)"

on:
  workflow_call:
    inputs:
      tag_name:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (ဥပမာ v1.4.9-en)'
        required: false
  push:
    tags:
      - 'v*-en'

permissions:
  contents: write
  actions: read

jobs:
  build-and-package:
    name: "Build Yakit (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: "1. Checkout Source (English Edition)"
        uses: actions/checkout@v4
        with:
          ref: 'english-edition'

      - name: "2. Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "3. Prepare Environment & Force Workspace Links"
        shell: bash
        run: |
          # (၁) Native fix for Git 'status: 128' Error
          git config --global --add safe.directory '*'
          git config --global user.email "bot@yaklang.io"
          git config --global user.name "Yakit Bot"
          git commit --allow-empty -m "Trigger build" || true
          git tag -f ${{ github.event.inputs.tag_name || github.ref_name || 'v1.4.9-en' }} || true

          # (၂) Yarn PnP ကို ပိတ်ပြီး သာမန် node_modules စနစ်ကို အသုံးပြုရန် သတ်မှတ်ခြင်း (အလွန်အရေးကြီးပါသည်)
          echo "nodeLinker: node-modules" > .yarnrc.yml
          
          # (၃) Install Dependencies (Workspace link များကို အတင်းအဓမ္မ ပြန်ချိတ်ပါမည်)
          yarn install --immutable || yarn install

          # (၄) Internal Libraries များကို အသေချာဆုံး Build လုပ်ခြင်း (Local Dependencies အားလုံး အဆင်သင့်ဖြစ်စေရန်)
          echo "Building internal workspaces..."
          yarn workspaces foreach -pt run build || true
          
          # (၅) အကယ်၍ workspace loop ပျက်ကွက်ခဲ့လျှင် Manual ဝင်ရောက် Build မည်
          for dir in libs/* packages/*; do
            if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
              echo "Manually building: $dir"
              (cd "$dir" && yarn run build || npm run build || true)
            fi
          done

          # Render UI အတွက် လိုအပ်သော Install များ
          (cd app/renderer/src/main && yarn install)
          (cd app/renderer/engine-link-startup && yarn install)

      - name: "4. Build & Package Electron App"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          DEBUG: "electron-builder" 
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: bash
        run: |
          yarn release-render || npm run release-render
          yarn release-link-render || npm run release-link-render
          
          # ယခုအခါ 'nodeLinker: node-modules' ကြောင့် '@yakit-libs/color/node' ကို အလိုအလျောက် ရှာတွေ့သွားပါမည်
          yarn build:electron || npm run build:electron
          
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            npx electron-builder --win --x64
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            npx electron-builder --mac --x64
            npx electron-builder --mac --arm64
          else
            sudo apt-get update && sudo apt-get install -y icnsutils graphicsmagick bsdtar build-essential || true
            npx electron-builder --linux --x64
          fi

      - name: "5. Build & Package Electron App"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          yarn release-render || npm run release-render
          yarn release-link-render || npm run release-link-render
          
          # ယခုအခါ build-electron က @yakit-libs/color/node ကို ခေါ်လိုက်သည်နှင့် 
          # scripts/node_modules အောက်ရှိ ကျွန်ုပ်တို့၏ Proxy ဖိုင်ကို တိုက်ရိုက်တွေ့ရှိသွားမည်ဖြစ်၍ လုံးဝ (လုံးဝ) Error ထပ်မတက်နိုင်တော့ပါ။
          yarn build:electron || npm run build:electron
          
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            npx electron-builder --win --x64
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            npx electron-builder --mac --x64
            npx electron-builder --mac --arm64
          else
            npx electron-builder --linux --x64
          fi

      - name: "6. Upload Artifacts to Pipeline"
        uses: actions/upload-artifact@v4
        with:
          name: yakit-release-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.zip
            build/*.exe
            build/*.dmg
            build/*.AppImage
          if-no-files-found: warn
          retention-days: 1

  publish-release:
    name: "Publish GitHub Release"
    needs: build-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "1. Download All OS Artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: yakit-release-*
          path: release-assets
          merge-multiple: true

      - name: "2. Verify Artifacts"
        run: ls -lh release-assets/

      - name: "3. Publish GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: "Yakit English Edition (${{ inputs.tag_name || github.ref_name }})"
          overwrite: true
          body: |
            ### Yakit English Edition — ${{ inputs.tag_name || github.ref_name }}
            * **100% Translated to English** via Yaklang Ecosystem Automation.
            * Includes native **English Yaklang Engine**.
            * Bundles ecosystem assets: **English Chrome Extension**, **AI Skills**, **PoCs**, and **Standalone Tools** (`JavaJive`, `SyntaxFlow`, etc.).
          draft: false
          prerelease: false
          files: release-assets/*
