name: Build & Release Yakit (English Edition)

on:
  push:
    tags:
      - 'v*-en'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.4.9-en)'
        required: false

permissions:
  contents: write

jobs:
  build-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: "1. Checkout Source"
        uses: actions/checkout@v4

      - name: "2. Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "3. Prepare Environment & Dependencies"
        shell: bash
        run: |
          # 1. Git safe.directory fix
          git config --global --add safe.directory '*'
          git config --global user.email "bot@yaklang.io"
          git config --global user.name "Yakit Bot"
          git commit --allow-empty -m "Trigger build" || true
          git tag -f ${{ github.event.inputs.tag_name || github.ref_name || 'v1.4.9-en' }} || true

          # 2. Force Node Modules Linker for Yarn Workspaces
          echo "nodeLinker: node-modules" > .yarnrc.yml

          # 3. Global Install
          yarn install --immutable || yarn install
          
          # 4. Explicitly build all internal libraries
          echo "Building internal workspaces..."
          for dir in libs/* packages/*; do
            if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
              echo "Building: $dir"
              (cd "$dir" && yarn install && (yarn run build || npm run build || true))
            fi
          done

          # 5. Ensure Renderer Dependencies are fully installed
          echo "Installing renderer dependencies..."
          (cd app/renderer/src/main && yarn install)
          (cd app/renderer/engine-link-startup && yarn install)

      - name: "4. Build & Package Electron App"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: bash
        run: |
          echo "Starting renderer builds..."
          yarn release-render || npm run release-render
          yarn release-link-render || npm run release-link-render
          
          echo "Applying inline regex patch to build-electron.mjs..."
          # ဤ Node script သည် build-electron.mjs ဖိုင်ထဲရှိ require ခေါ်ဆိုမှုကို ရှာဖွေပြီး 
          # Error မတက်နိုင်သော Proxy Object ဖြင့် တိုက်ရိုက် အစားထိုးလိုက်ပါမည်။
          node -e "
          const fs = require('fs');
          const file = 'scripts/build-electron.mjs';
          if (fs.existsSync(file)) {
            let code = fs.readFileSync(file, 'utf8');
            // require('@yakit-libs/color/node') ကို Proxy ဖြင့် အတိအကျ အစားထိုးမည်
            code = code.replace(/require\(\s*['\"]@yakit-libs\/color\/node['\"]\s*\)/g, 'new Proxy({}, { get: () => (t) => t || \"\" })');
            fs.writeFileSync(file, code);
            console.log('Successfully patched require call in ' + file);
          } else {
            console.log('Script file not found, skipping patch.');
          }
          "
          
          echo "Starting main electron build..."
          # ကုဒ်ထဲတွင် require မရှိတော့သဖြင့် MODULE_NOT_FOUND လုံးဝ (လုံးဝ) ထပ်မတက်နိုင်တော့ပါ။
          yarn build:electron || npm run build:electron
          
          echo "Packaging application..."
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            npx electron-builder --win --x64
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            npx electron-builder --mac --x64
            npx electron-builder --mac --arm64
          else
            sudo apt-get update && sudo apt-get install -y icnsutils graphicsmagick bsdtar build-essential || true
            npx electron-builder --linux --x64
          fi

      - name: "5. Upload Artifacts to Pipeline"
        uses: actions/upload-artifact@v4
        with:
          name: yakit-release-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: warn

  publish-release:
    needs: build-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Download all artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: yakit-release-*
          path: release-assets
          merge-multiple: true

      - name: "Publish GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "Yakit English Edition (${{ github.event.inputs.tag_name || github.ref_name }})"
          target_commitish: ${{ github.sha }}
          overwrite: true
          draft: false
          prerelease: false
          files: release-assets/*
