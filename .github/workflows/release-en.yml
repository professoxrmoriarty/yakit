name: Build and Release Yakit (English Edition)

on:
  workflow_call:
    inputs:
      tag_name:
        type: string
        required: true
      target_ref:
        type: string
        required: false
        default: 'english-edition'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag အမည် (ဥပမာ v1.4.9-1023-en)'
        required: false
        default: ''
      target_ref:
        description: 'Build လုပ်မည့် Branch (ပုံမှန် english-edition)'
        required: false
        default: 'english-edition'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # အဆင့် (၁) - Official CDN မှ Yak Engine များနှင့် Chrome Extension ကို ဆွဲယူခြင်း
  # ---------------------------------------------------------------------------
  prepare-engine:
    name: Fetch Yak Engine Binaries & Chrome Plugin
    runs-on: ubuntu-latest
    outputs:
      yak_version: ${{ steps.fetch_bins.outputs.yak_version }}
    steps:
      - name: 1. Download Latest Yak Engine & Chrome Plugin (Official Layout)
        id: fetch_bins
        run: |
          mkdir -p bins/scripts
          CDN_PRIMARY="https://yaklang.oss-accelerate.aliyuncs.com/yak"
          CDN_FALLBACK="https://oss-qn.yaklang.com/yak"

          # 1. Fetch Engine Version
          curl -fsSL --retry 3 "${CDN_PRIMARY}/latest/version.txt" -o bins/engine-version.txt || \
          curl -fsSL --retry 3 "${CDN_FALLBACK}/latest/version.txt" -o bins/engine-version.txt

          YAK_VER=$(tr -d '[:space:]' < bins/engine-version.txt)
          echo "yak_version=${YAK_VER}" >> "$GITHUB_OUTPUT"
          echo "Detected Yak Engine Version: ${YAK_VER}"

          # 2. Download Chrome Extension (Required by Official Build)
          EXT_VER=$(curl -fsSL "https://yaklang.oss-accelerate.aliyuncs.com/chrome-extension/latest-version.txt" | tr -d '[:space:]') || true
          if [ -n "$EXT_VER" ]; then
            curl -fsSL --retry 3 "https://yaklang.oss-accelerate.aliyuncs.com/chrome-extension/yakit-chrome-extension-v${EXT_VER}.zip" \
              -o "bins/scripts/google-chrome-plugin.zip" || true
          fi

          # 3. Linux Engines (Official build expects .zip files in bins/)
          for ARCH in amd64 arm64; do
            BIN="yak_linux_${ARCH}"
            curl -fsSL --retry 3 "${CDN_PRIMARY}/${YAK_VER}/${BIN}" -o "bins/${BIN}" || \
            curl -fsSL --retry 3 "${CDN_FALLBACK}/${YAK_VER}/${BIN}" -o "bins/${BIN}"
            chmod +x "bins/${BIN}"
            zip -j "bins/${BIN}.zip" "bins/${BIN}"
            rm -f "bins/${BIN}"
          done

          # 4. Windows Normal Engine
          curl -fsSL --retry 3 "${CDN_PRIMARY}/${YAK_VER}/yak_windows_amd64.exe" -o "bins/yak_windows_amd64.exe" || \
          curl -fsSL --retry 3 "${CDN_FALLBACK}/${YAK_VER}/yak_windows_amd64.exe" -o "bins/yak_windows_amd64.exe"
          zip -j bins/yak_windows_normal_amd64.zip bins/yak_windows_amd64.exe
          rm -f bins/yak_windows_amd64.exe

          # 5. Windows Legacy Engine (Official name uses underscore: yak_windows_legacy_amd64.exe)
          if curl -fsSL --retry 3 "${CDN_PRIMARY}/${YAK_VER}/yak_windows_legacy_amd64.exe" -o "bins/yak_windows_amd64.exe" || \
             curl -fsSL --retry 3 "${CDN_FALLBACK}/${YAK_VER}/yak_windows_legacy_amd64.exe" -o "bins/yak_windows_amd64.exe" || \
             curl -fsSL --retry 3 "${CDN_PRIMARY}/${YAK_VER}/yak_windows-legacy_amd64.exe" -o "bins/yak_windows_amd64.exe"; then
            zip -j bins/yak_windows_legacy_amd64.zip bins/yak_windows_amd64.exe
            rm -f bins/yak_windows_amd64.exe
          fi

          # 6. macOS Engines & SHA256 files
          for ARCH in amd64 arm64; do
            BIN="yak_darwin_${ARCH}"
            curl -fsSL --retry 3 "${CDN_PRIMARY}/${YAK_VER}/${BIN}" -o "bins/${BIN}" || \
            curl -fsSL --retry 3 "${CDN_FALLBACK}/${YAK_VER}/${BIN}" -o "bins/${BIN}"
            chmod +x "bins/${BIN}"
            curl -fsSL --retry 3 "${CDN_PRIMARY}/${YAK_VER}/${BIN}.sha256.txt" -o "bins/${BIN}.sha256.txt" || true
          done

          ls -lh bins/ bins/scripts/

      - name: 2. Upload Engine Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yak-engine-bins
          path: bins/
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------------
  # အဆင့် (၂) - OS မျိုးစုံအတွက် (Yakit, IRify, Memfit AI) သုံးမျိုးလုံးကို Build ခြင်း
  # ---------------------------------------------------------------------------
  build-matrix:
    name: Build English Edition (${{ matrix.platform }})
    needs: prepare-engine
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac

    env:
      CI: ""
      NODE_OPTIONS: "--max-old-space-size=8192"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ENGINE_VERSION: ${{ needs.prepare-engine.outputs.yak_version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 1. Determine Checkout Ref & Version Tag
        id: ref_select
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TARGET="${GITHUB_REF_NAME}"
            RAW_TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            TARGET="${{ inputs.target_ref || 'english-edition' }}"
            RAW_TAG="${{ inputs.tag_name }}"
          else
            TARGET="english-edition"
            RAW_TAG="v$(date +'%Y.%m.%d')-en"
          fi
          echo "ref=${TARGET}" >> "$GITHUB_OUTPUT"
          ENV_TAG="${RAW_TAG#v}"
          echo "ENV_TAG=${ENV_TAG}" >> "$GITHUB_ENV"
          echo "Building Ref: ${TARGET} with ENV_TAG: ${ENV_TAG}"

      - name: 2. Checkout English Edition Code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref_select.outputs.ref }}
          fetch-depth: 1

      - name: 3. Setup Node.js 22 & Yarn
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: 4. Ensure Yarn is Installed
        run: yarn --version || npm install -g yarn

      - name: 5. Install Linux System Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 rpm zip || sudo apt-get install -y libfuse2 rpm zip

      - name: 6. Restore Yak Engine Binaries
        uses: actions/download-artifact@v4
        with:
          name: yak-engine-bins
          path: bins/

      - name: 7. Prepare Binaries & Unpack Linux Zips if Needed by CLI
        run: |
          chmod +x bins/yak_darwin_* 2>/dev/null || true
          # CLI direct mode သုံးပါက unzipped binary နှင့် zip နှစ်မျိုးလုံး အဆင်သင့်ရှိနေစေရန်
          if [ -f "bins/yak_linux_amd64.zip" ] && [ ! -f "bins/yak_linux_amd64" ]; then
            unzip -o bins/yak_linux_amd64.zip -d bins/ || true
            chmod +x bins/yak_linux_amd64 || true
          fi
          if [ -f "bins/yak_linux_arm64.zip" ] && [ ! -f "bins/yak_linux_arm64" ]; then
            unzip -o bins/yak_linux_arm64.zip -d bins/ || true
            chmod +x bins/yak_linux_arm64 || true
          fi
          ls -lh bins/

      - name: 8. Enforce English Default Language Safeguard
        run: |
          node -e '
            const fs = require("fs");
            const i18nFiles = [
              "app/renderer/src/main/src/i18n/i18n.ts",
              "app/renderer/engine-link-startup/src/i18n/i18n.ts",
              "app/renderer/engine-link-startup/src/i18n.ts"
            ];
            for (const f of i18nFiles) {
              if (fs.existsSync(f)) {
                let s = fs.readFileSync(f, "utf8");
                s = s.replace(/(lng\s*:\s*)([^,\n]*?)\x27zh(-CN)?\x27/g, "$1localStorage.getItem(\x27i18nextLng\x27) || \x27en\x27");
                s = s.replace(/(fallbackLng\s*:\s*)\x27zh(-CN)?\x27/g, "$1\x27en\x27");
                fs.writeFileSync(f, s, "utf8");
              }
            }
            for (const h of ["app/renderer/src/main/index.html", "app/renderer/engine-link-startup/index.html"]) {
              if (fs.existsSync(h)) {
                let s = fs.readFileSync(h, "utf8").replace(/正在加载中/g, "Loading...");
                fs.writeFileSync(h, s, "utf8");
              }
            }
          '

      - name: 9. Install Dependencies
        run: |
          yarn config set network-timeout 300000
          yarn install --ignore-engines

      - name: 10. Build & Package All 3 Editions (Yakit, IRify, Memfit AI)
        run: |
          mkdir -p release dist

          # Official buildPreScript.sh + CLI / Builder တွဲဖက်အသုံးပြုခြင်း
          for PROD in yakit irify memfit; do
            echo "======================================"
            echo "Building Product: ${PROD} (${{ matrix.platform }})"
            echo "======================================"

            if [ -f "./packageScript/script/buildPreScript.sh" ]; then
              chmod +x ./packageScript/script/buildPreScript.sh
              ./packageScript/script/buildPreScript.sh "${PROD}" || true
            fi

            if [ -f "cli/cli.mjs" ]; then
              if [ "${PROD}" = "yakit" ]; then
                yarn cli build -v yakit --devtools
              else
                yarn cli build -v "${PROD}"
              fi
              yarn cli pack -s ${{ matrix.platform }} -v "${PROD}"
            fi
          done

          ls -lh release/ dist/ || true

      - name: 11. Upload OS Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yakit-English-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            !release/*unpacked*
            !dist/*unpacked*
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------------
  # အဆင့် (၃) - ပြီးပြည့်စုံသော (၃) မျိုးခွဲ Release များကို GitHub သို့ တင်ခြင်း
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish English Release (Yakit, IRify, Memfit AI)
    needs: [prepare-engine, build-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: 1. Download All OS Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Yakit-English-*
          path: release-assets
          merge-multiple: true

      - name: 2. Resolve Final Release Tag
        id: resolve_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            FINAL_TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            FINAL_TAG="${{ inputs.tag_name }}"
          else
            FINAL_TAG="v$(date +'%Y.%m.%d')-en"
          fi
          echo "tag=${FINAL_TAG}" >> "$GITHUB_OUTPUT"
          echo "=== Downloaded Release Assets ==="
          find release-assets/ -type f -exec ls -lh {} +

      - name: 3. Publish Yakit Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: "Yakit English Edition (${{ steps.resolve_tag.outputs.tag }})"
          overwrite: true
          body: |
            ### Yakit English Edition — ${{ steps.resolve_tag.outputs.tag }}
            * **Default Language:** English (`en`) enabled out of the box.
            * **Bundled Yak Engine:** `${{ needs.prepare-engine.outputs.yak_version }}`
            * **Supported Platforms:** Windows (`.exe`), macOS Apple Silicon & Intel (`.dmg`), Linux x64/arm64 (`.AppImage`).
            * **Unsigned Installer Note:**
              * **Windows:** SmartScreen တက်လာပါက `More info` → `Run anyway` ကို နှိပ်ပါ။
              * **macOS:** `sudo xattr -rd com.apple.quarantine /Applications/Yakit.app` ကို Run ၍ ဖွင့်ပါ။
          draft: false
          prerelease: false
          files: |
            release-assets/**/Yakit*.exe
            release-assets/**/Yakit*.dmg
            release-assets/**/Yakit*.AppImage

      - name: 4. Publish IRify Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}-irify
          name: "IRify English Edition (${{ steps.resolve_tag.outputs.tag }}-irify)"
          overwrite: true
          body: |
            ### IRify English Edition — ${{ steps.resolve_tag.outputs.tag }}-irify
            * **Default Language:** English (`en`) enabled out of the box.
            * **Bundled Yak Engine:** `${{ needs.prepare-engine.outputs.yak_version }}`
            * **Description:** Static code analysis & rule evaluation brought to GUI.
          draft: false
          prerelease: false
          files: |
            release-assets/**/IRify*.exe
            release-assets/**/IRify*.dmg
            release-assets/**/IRify*.AppImage

      - name: 5. Publish Memfit AI Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}-memfit
          name: "Memfit AI English Edition (${{ steps.resolve_tag.outputs.tag }}-memfit)"
          overwrite: true
          body: |
            ### Memfit AI English Edition — ${{ steps.resolve_tag.outputs.tag }}-memfit
            * **Default Language:** English (`en`) enabled out of the box.
            * **Bundled Yak Engine:** `${{ needs.prepare-engine.outputs.yak_version }}`
            * **Description:** Open-source cybersecurity AI Agent orchestration framework.
          draft: false
          prerelease: false
          files: |
            release-assets/**/Memfit*.exe
            release-assets/**/Memfit*.dmg
            release-assets/**/Memfit*.AppImage
