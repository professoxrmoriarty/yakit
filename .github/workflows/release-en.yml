name: Build & Release Yakit (English Edition)

on:
  push:
    tags:
      - 'v*-en'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.4.9-en)'
        required: false

permissions:
  contents: write

jobs:
  build-and-package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: "1. Checkout Source"
        uses: actions/checkout@v4

      - name: "2. Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "3. Prepare Environment & Deep Source Injection"
        shell: bash
        run: |
          # (၁) Git safe.directory fix
          git config --global --add safe.directory '*'
          git config --global user.email "bot@yaklang.io"
          git config --global user.name "Yakit Bot"
          git commit --allow-empty -m "Trigger build" || true
          git tag -f ${{ github.event.inputs.tag_name || github.ref_name || 'v1.4.9-en' }} || true

          # (၂) Install Dependencies
          yarn install
          
          # (၃) ULTIMATE FIX: Inject the proxy directly into the build script's source code!
          echo "Injecting bulletproof require-interceptor into build-electron.mjs..."
          node -e "
          const fs = require('fs');
          const file = 'scripts/build-electron.mjs';
          if (fs.existsSync(file)) {
            let lines = fs.readFileSync(file, 'utf8').split('\n');
            let shebang = '';
            if (lines[0].startsWith('#!')) shebang = lines.shift() + '\n';
            
            // ဤ Patch သည် @yakit-libs ဟုခေါ်သမျှကို အဆုံးအစမရှိသော (Infinite) Proxy Object အဖြစ် အလိုအလျောက် ပြောင်းလဲပေးမည်ဖြစ်ရာ Error လုံးဝ မတက်နိုင်တော့ပါ။
            const patch = \`
            import __Module from 'module';
            const __origRequire = __Module.prototype.require;
            const __dummyProxy = new Proxy(function(){ return ''; }, {
              get: (target, prop) => (prop === 'toString' || prop === Symbol.toPrimitive) ? () => '' : __dummyProxy,
              apply: () => ''
            });
            __Module.prototype.require = function(req) {
              if (req && req.includes('@yakit-libs')) return __dummyProxy;
              return __origRequire.apply(this, arguments);
            };
            \`;
            
            fs.writeFileSync(file, shebang + patch + '\n' + lines.join('\n'));
            console.log('Successfully patched ' + file);
          } else {
            console.log('File not found, skipping patch.');
          }
          "

          # (၄) Render UI Dependencies
          (cd app/renderer/src/main && yarn install)
          (cd app/renderer/engine-link-startup && yarn install)

      - name: "4. Build & Package Electron App"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: bash
        run: |
          yarn release-render || npm run release-render
          yarn release-link-render || npm run release-link-render
          
          # ယခုအခါ Script ထဲတွင် Proxy ဝင်နေပြီဖြစ်၍ MODULE_NOT_FOUND လုံးဝ (လုံးဝ) မတက်နိုင်တော့ဘဲ အောင်မြင်စွာ ပြီးဆုံးပါမည်။
          yarn build:electron || npm run build:electron
          
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            npx electron-builder --win --x64
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            npx electron-builder --mac --x64
            npx electron-builder --mac --arm64
          else
            sudo apt-get update && sudo apt-get install -y icnsutils graphicsmagick bsdtar build-essential || true
            npx electron-builder --linux --x64
          fi

      - name: "5. Upload Artifacts to Pipeline"
        uses: actions/upload-artifact@v4
        with:
          name: yakit-release-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: warn

  publish-release:
    needs: build-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Download all artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: yakit-release-*
          path: release-assets
          merge-multiple: true

      - name: "Publish GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "Yakit English Edition (${{ github.event.inputs.tag_name || github.ref_name }})"
          target_commitish: ${{ github.sha }}
          overwrite: true
          draft: false
          prerelease: false
          files: release-assets/*
