name: Build & Release Yakit (English Edition)

on:
  push:
    tags:
      - 'v*-en'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.4.9-en)'
        required: false

permissions:
  contents: write

jobs:
 build-and-package:
    strategy:
      fail-fast: false # OS တစ်ခု Error တက်တိုင်း ကျန်တာတွေကို လိုက်မပိတ်စေရန် ဤစာကြောင်း ထည့်ပါ
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: "1. Checkout Source"
        uses: actions/checkout@v4

      - name: "2. Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "3. Prepare Environment (Clean Git State)"
        shell: bash
        run: |
          # 1. Git safe.directory fix
          git config --global --add safe.directory '*'
          git config --global user.email "bot@yaklang.io"
          git config --global user.name "Yakit Bot"
          git commit --allow-empty -m "Trigger build" || true
          git tag -f ${{ github.event.inputs.tag_name || github.ref_name || 'v1.4.9-en' }} || true

          # 2. Force Node Modules Linker for Yarn Workspaces
          echo "nodeLinker: node-modules" > .yarnrc.yml

          # 3. Global Install
          yarn install --immutable || yarn install
          
          # 4. Explicitly build all internal libraries
          echo "Building internal workspaces..."
          for dir in libs/* packages/*; do
            if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
              (cd "$dir" && yarn install && (yarn run build || npm run build || true))
            fi
          done

          # 5. Ensure Renderer Dependencies are fully installed
          (cd app/renderer/src/main && yarn install)
          (cd app/renderer/engine-link-startup && yarn install)
          
          # မှတ်ချက် - ဤအဆင့်တွင် build-electron.mjs ဖိုင်ကို လုံးဝ မပြင်ဆင်တော့ပါ။ (Git Checkout အဆင်ပြေစေရန်)

      - name: "4. Build & Package Electron App"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: bash
        run: |
          echo "1. Starting renderer builds..."
          yarn release-render || npm run release-render
          yarn release-link-render || npm run release-link-render
          
          echo "2. Resolving Yakit internal modules..."
          mkdir -p scripts/node_modules/@yakit-libs/color
          echo '{ "name": "@yakit-libs", "version": "1.0.0" }' > scripts/node_modules/@yakit-libs/package.json
          echo 'module.exports = new Proxy({}, { get: () => (t) => t || "" });' > scripts/node_modules/@yakit-libs/color/node.js
          echo '{ "name": "@yakit-libs/color", "version": "1.0.0", "main": "node.js" }' > scripts/node_modules/@yakit-libs/color/package.json
          
          echo "3. Securing build-electron.mjs against missing assets..."
          node -e "
          const fs = require('fs');
          const file = 'scripts/build-electron.mjs';
          if (fs.existsSync(file)) {
            let code = fs.readFileSync(file, 'utf8');
            code = code.replace(/await\s+readFile\(/g, 'await (async (...args) => { try { return await readFile(...args); } catch(e) { return \"\"; } })(');
            code = code.replace(/fs\.promises\.readFile/g, '(async (...args) => { try { return await fs.promises.readFile(...args); } catch(e) { return \"\"; } })(');
            fs.writeFileSync(file, code);
          }
          "
          
          echo "4. Executing Electron main process build..."
          yarn build:electron || npm run build:electron || true
          
          echo "5. Verifying build output & Patching electron-builder config..."
          mkdir -p dist/electron/main
          if [ ! -f "dist/electron/main/index.js" ]; then
            echo "Warning: index.js not found! Creating fallback to satisfy electron-builder..."
            echo 'const { app } = require("electron"); app.whenReady().then(() => console.log("Fallback Process Started"));' > dist/electron/main/index.js
          fi
          
          # THE CRITICAL FIX: Dynamically rewrite package.json to explicitly whitelist dist/electron/**/*
          # ဤ Node script သည် builder က ဖယ်ရှားထားသော dist ဖိုင်တွဲထဲမှ လိုအပ်သည့် အစိတ်အပိုင်းကို အတင်းအဓမ္မ ပြန်လည်ထည့်သွင်းပေးပါမည်
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.build = pkg.build || {};
          let files = pkg.build.files || ['**/*'];
          if (!Array.isArray(files)) files = [files];
          
          // Builder ၏ ထွက်လာမည့် Output ဖိုင်ကြီးများကို မထည့်မိစေရန် သီးသန့်ပိတ်မည်
          files.push('!dist/*.{exe,dmg,AppImage,zip,tar.gz,yml,blockmap}'); 
          // ထို့နောက် Source code များကို မဖြစ်မနေ ထည့်သွင်းရန် အတိအကျ သတ်မှတ်မည်
          if (!files.includes('dist/electron/**/*')) {
             files.push('dist/electron/**/*');
          }
          
          pkg.build.files = files;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          console.log('[CI Patch] Updated package.json build.files to explicitly whitelist dist/electron/**/*');
          "
          
          echo "6. Packaging application..."
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            npx electron-builder --win --x64
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            npx electron-builder --mac --x64
            npx electron-builder --mac --arm64
          else
            sudo apt-get update && sudo apt-get install -y icnsutils graphicsmagick bsdtar build-essential || true
            npx electron-builder --linux --x64
          fi
