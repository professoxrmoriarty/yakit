name: Build & Release Yakit (English Edition)

on:
  push:
    tags:
      - 'v*-en'
  workflow_call:
    inputs:
      tag_name:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.4.9-en)'
        required: false

permissions:
  contents: write

jobs:
  build-and-package:
    strategy:
      fail-fast: false 
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: "1. Checkout Source"
        uses: actions/checkout@v4

      - name: "2. Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "3. Prepare Environment (Clean Git State)"
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git config --global user.email "bot@yaklang.io"
          git config --global user.name "Yakit Bot"
          git commit --allow-empty -m "Trigger build" || true
          
          INPUT_TAG="${{ inputs.tag_name || github.event.inputs.tag_name }}"
          if [[ -n "$INPUT_TAG" ]]; then
            git tag -f "$INPUT_TAG" || true
          else
            git tag -f "v$(date +'%Y.%m.%d')-en" || true
          fi

          echo "nodeLinker: node-modules" > .yarnrc.yml
          yarn install --immutable || yarn install
          
          echo "Building internal workspaces..."
          for dir in libs/* packages/*; do
            if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
              (cd "$dir" && yarn install && (yarn run build || npm run build || true))
            fi
          done

          (cd app/renderer/src/main && yarn install)
          (cd app/renderer/engine-link-startup && yarn install)

      - name: "4. Build & Package Electron App (Yakit, IRify, Memfit)"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: bash
        run: |
          echo "1. Starting renderer builds..."
          yarn release-render || npm run release-render
          yarn release-link-render || npm run release-link-render
          
          echo "2. Resolving Yakit internal modules..."
          mkdir -p scripts/node_modules/@yakit-libs/color
          echo '{ "name": "@yakit-libs", "version": "1.0.0" }' > scripts/node_modules/@yakit-libs/package.json
          echo 'module.exports = new Proxy({}, { get: () => (t) => t || "" });' > scripts/node_modules/@yakit-libs/color/node.js
          echo '{ "name": "@yakit-libs/color", "version": "1.0.0", "main": "node.js" }' > scripts/node_modules/@yakit-libs/color/package.json
          
          echo "3. Securing build-electron.mjs against missing assets..."
          node -e "
          const fs = require('fs');
          const file = 'scripts/build-electron.mjs';
          if (fs.existsSync(file)) {
            let code = fs.readFileSync(file, 'utf8');
            code = code.replace(/await\s+readFile\(/g, 'await (async (...args) => { try { return await readFile(...args); } catch(e) { return \"\"; } })(');
            code = code.replace(/fs\.promises\.readFile/g, '(async (...args) => { try { return await fs.promises.readFile(...args); } catch(e) { return \"\"; } })(');
            fs.writeFileSync(file, code);
          }
          "
          
          echo "4. Executing Electron main process build (All 3 Apps)..."
          if [ -f "cli/cli.mjs" ]; then
            yarn cli build -v yakit --devtools || true
            yarn cli build -v irify || true
            yarn cli build -v memfit || true
          else
            yarn build:electron || npm run build:electron || true
          fi
          
          echo "5. Verifying build output & Patching electron-builder config..."
          mkdir -p dist/electron/main
          if [ ! -f "dist/electron/main/index.js" ]; then
            echo "Warning: index.js not found! Creating fallback to satisfy electron-builder..."
            echo 'const { app } = require("electron"); app.whenReady().then(() => console.log("Fallback Process Started"));' > dist/electron/main/index.js
          fi
          
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.build = pkg.build || {};
          let files = pkg.build.files || ['**/*'];
          if (!Array.isArray(files)) files = [files];
          files.push('!dist/*.{exe,dmg,AppImage,zip,tar.gz,yml,blockmap}'); 
          if (!files.includes('dist/electron/**/*')) { files.push('dist/electron/**/*'); }
          pkg.build.files = files;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          
          echo "6. Packaging applications (Yakit, IRify, Memfit)..."
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            PLATFORM_ARGS="--win --x64"
            PLATFORM="win"
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            PLATFORM_ARGS="--mac --x64 --arm64"
            PLATFORM="mac"
          else
            sudo apt-get update && sudo apt-get install -y icnsutils graphicsmagick bsdtar build-essential || true
            PLATFORM_ARGS="--linux --x64"
            PLATFORM="linux"
          fi

          if [ -f "cli/cli.mjs" ]; then
             yarn cli pack -s $PLATFORM -v yakit || npx electron-builder $PLATFORM_ARGS
             yarn cli pack -s $PLATFORM -v irify || true
             yarn cli pack -s $PLATFORM -v memfit || true
          else
             npx electron-builder $PLATFORM_ARGS
          fi

      - name: "5. Upload Artifacts to Pipeline"
        uses: actions/upload-artifact@v4
        with:
          name: yakit-release-${{ matrix.os }}
          path: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.AppImage
            release/**/*.exe
            release/**/*.dmg
            release/**/*.AppImage
          if-no-files-found: warn
          retention-days: 1

  publish-release:
    needs: build-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Download all artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: yakit-release-*
          path: release-assets
          merge-multiple: true

      - name: "Display downloaded files"
        run: |
          echo "Downloaded release assets:"
          ls -la release-assets/

      - name: "Resolve Tag Name"
        id: tag
        run: |
          # ဤနေရာတွင် workflow_call နှင့် workflow_dispatch နှစ်ခုလုံးအတွက် အတိအကျ အလုပ်လုပ်စေရန် ပြင်ဆင်ထားပါသည်
          INPUT_TAG="${{ inputs.tag_name || github.event.inputs.tag_name }}"
          
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            FINAL_TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            FINAL_TAG="${INPUT_TAG}"
          else
            FINAL_TAG="v$(date +'%Y.%m.%d')-en"
          fi
          
          # Branch အမည်ကို Tag အဖြစ် မှားယွင်းမယူမိစေရန် ကာကွယ်ခြင်း (HttpError 403 ကို အပြည့်အဝ တားဆီးပေးပါမည်)
          if [[ "${FINAL_TAG}" == "english-edition" || "${FINAL_TAG}" == "main" || "${FINAL_TAG}" == "master" ]]; then
            FINAL_TAG="v$(date +'%Y.%m.%d')-en"
          fi
          
          echo "FINAL_TAG=${FINAL_TAG}" >> "$GITHUB_OUTPUT"
          echo "Using Release Tag: ${FINAL_TAG}"

      - name: "Publish Yakit Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.FINAL_TAG }}
          name: "Yakit English Edition (${{ steps.tag.outputs.FINAL_TAG }})"
          draft: false
          prerelease: false
          files: |
            release-assets/**/Yakit*.exe
            release-assets/**/Yakit*.dmg
            release-assets/**/Yakit*.AppImage

      - name: "Publish IRify Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.FINAL_TAG }}-irify
          name: "IRify English Edition (${{ steps.tag.outputs.FINAL_TAG }}-irify)"
          body: |
            ### IRify English Edition — ${{ steps.tag.outputs.FINAL_TAG }}-irify
            * **Default Language:** English (`en`) enabled out of the box.
            * **Description:** Static code analysis & rule evaluation brought to GUI.
          draft: false
          prerelease: false
          files: |
            release-assets/**/IRify*.exe
            release-assets/**/IRify*.dmg
            release-assets/**/IRify*.AppImage

      - name: "Publish Memfit AI Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.FINAL_TAG }}-memfit
          name: "Memfit AI English Edition (${{ steps.tag.outputs.FINAL_TAG }}-memfit)"
          body: |
            ### Memfit AI English Edition — ${{ steps.tag.outputs.FINAL_TAG }}-memfit
            * **Default Language:** English (`en`) enabled out of the box.
            * **Description:** Open-source cybersecurity AI Agent orchestration framework.
          draft: false
          prerelease: false
          files: |
            release-assets/**/Memfit*.exe
            release-assets/**/Memfit*.dmg
            release-assets/**/Memfit*.AppImage
