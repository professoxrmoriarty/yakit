name: "2. Build & Release Yakit (English Edition)"

on:
  workflow_call:
    inputs:
      tag_name:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (ဥပမာ v1.4.9-en)'
        required: false
  push:
    tags:
      - 'v*-en'

permissions:
  contents: write
  actions: read

jobs:
  build-and-package:
    name: "Build Yakit (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: "1. Checkout Source (English Edition)"
        uses: actions/checkout@v4
        with:
          ref: 'english-edition'

      - name: "2. Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "3. Pull English Ecosystem Assets"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          echo "Creating Asset Directories..."
          mkdir -p bins/scripts bins/tools bins/skills bins/engine 2>/dev/null || true
          mkdir -p app/main/assets/bins/scripts app/main/assets/bins/tools app/main/assets/bins/skills app/main/assets/bins/engine 2>/dev/null || true

          echo "1. Downloading English Yaklang Engine..."
          gh release download --repo "professoxrmoriarty/yaklang" --pattern "yak_*" --dir "bins/engine/" --clobber 2>/dev/null || true

          echo "2. Downloading English Chrome Extension..."
          gh release download --repo "professoxrmoriarty/yaklang-chrome-extension" --pattern "google-chrome-plugin.zip" --output "bins/scripts/google-chrome-plugin.zip" --clobber 2>/dev/null || true
          
          echo "3. Downloading English AI Skills, PoCs, & Materials..."
          for BUNDLE in hack-skills yak-skills irify-sast-skill control-theory-skill yaklang-ai-training-materials syntaxflow-ai-training-materials awesome-yak-scripts pentest-crawler-ai-enhance syntaxflow; do
            gh release download --repo "professoxrmoriarty/${BUNDLE}" --pattern "${BUNDLE}-bundle.zip" --output "bins/skills/${BUNDLE}-en.zip" --clobber 2>/dev/null || true
            gh release download --repo "professoxrmoriarty/${BUNDLE}" --pattern "${BUNDLE}-en.zip" --output "bins/scripts/${BUNDLE}-en.zip" --clobber 2>/dev/null || true
          done

          echo "4. Downloading JavaJive (Standalone Tool)..."
          gh release download --repo "professoxrmoriarty/javajive" --pattern "javajive_*" --dir "bins/tools/" --clobber 2>/dev/null || true
          
          # Copy to Electron bundle directory
          cp -r bins/* app/main/assets/bins/ 2>/dev/null || true

      - name: "4. Prepare Environment & Install Workspace Dependencies"
        shell: bash
        run: |
          # (၁) Git 'status: 128' Error ကို Native နည်းလမ်းဖြင့် ဖြေရှင်းခြင်း
          git config --global --add safe.directory '*'
          git config --global user.email "bot@yaklang.io"
          git config --global user.name "Yakit Bot"
          git commit --allow-empty -m "Trigger build" || true
          git tag -f v1.4.9-en || true

          # (၂) Workspace Dependencies များကို Install လုပ်ခြင်း
          # root တွင် အရင်ဆုံး install လုပ်မည်
          yarn install
          
          # (၃) Local Libraries များ (ဥပမာ @yakit-libs) ကို သေချာစွာ Build လုပ်မည်
          # module_not_found error ကို ဖြေရှင်းရန်ဖြစ်သည်
          for dir in libs/* packages/*; do
            if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
              echo "Building internal lib: $dir"
              (cd "$dir" && yarn install && (yarn build || npm run build || true))
            fi
          done
          
          # Render UI ပိုင်းများကို သေချာစွာ Install ထပ်လုပ်မည်
          (cd app/renderer/src/main && yarn install)
          (cd app/renderer/engine-link-startup && yarn install)

      - name: "5. Build & Package Electron App"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 1. Render UI များကို Build မည်
          yarn release-render
          yarn release-link-render
          
          # 2. Electron Main Process ကို Build မည်
          yarn build:electron
          
          # 3. Packaging လုပ်မည် (OS အလိုက်)
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            npx electron-builder --win --x64
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            npx electron-builder --mac --x64
            npx electron-builder --mac --arm64
          else
            npx electron-builder --linux --x64
          fi

      - name: "6. Upload Artifacts to Pipeline"
        uses: actions/upload-artifact@v4
        with:
          name: yakit-release-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.zip
            build/*.exe
            build/*.dmg
            build/*.AppImage
          if-no-files-found: warn
          retention-days: 1

  publish-release:
    name: "Publish GitHub Release"
    needs: build-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "1. Download All OS Artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: yakit-release-*
          path: release-assets
          merge-multiple: true

      - name: "2. Verify Artifacts"
        run: ls -lh release-assets/

      - name: "3. Publish GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: "Yakit English Edition (${{ inputs.tag_name || github.ref_name }})"
          overwrite: true
          body: |
            ### Yakit English Edition — ${{ inputs.tag_name || github.ref_name }}
            * **100% Translated to English** via Yaklang Ecosystem Automation.
            * Includes native **English Yaklang Engine**.
            * Bundles ecosystem assets: **English Chrome Extension**, **AI Skills**, **PoCs**, and **Standalone Tools** (`JavaJive`, `SyntaxFlow`, etc.).
          draft: false
          prerelease: false
          files: release-assets/*
