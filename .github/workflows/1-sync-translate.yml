name: "1. Smart Diff Sync & Progressive Override (Yakit)"

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: '၁၀၀% မပြီးသေးလည်း Release အတင်းထုတ်မည်လား? (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: "https://github.com/yaklang/yakit.git"
  UPSTREAM_BRANCH: "master"
  TARGET_BRANCH: "english-edition"
  YAKLANG_FORK_REPO: "https://github.com/professoxrmoriarty/yaklang.git"

jobs:
  sync-and-translate:
    name: "Sync & Progressive Override Yakit"
    runs-on: ubuntu-latest
    steps:
      - name: "1. Checkout Fork Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: "2. Configure Git & Sync Upstream Diffs"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Backup existing workflow and cache files
          mkdir -p /tmp/backup/workflows
          cp -r .github/workflows/* /tmp/backup/workflows/ 2>/dev/null || true
          [ -f ".github/security_glossary.json" ] && cp .github/security_glossary.json /tmp/backup/
          [ -f ".i18n_cache.json" ] && cp .i18n_cache.json /tmp/backup/

          # Fetch and merge from upstream
          git remote add upstream "${{ env.UPSTREAM_REPO }}" 2>/dev/null || git remote set-url upstream "${{ env.UPSTREAM_REPO }}"
          git fetch upstream "${{ env.UPSTREAM_BRANCH }}" --tags

          UP_REF="upstream/${{ env.UPSTREAM_BRANCH }}"
          git checkout -B "${{ env.TARGET_BRANCH }}" "origin/${{ env.TARGET_BRANCH }}" 2>/dev/null || git checkout -B "${{ env.TARGET_BRANCH }}" "$UP_REF"

          # Diff Sync: Keep new changes from upstream
          if ! git merge "$UP_REF" -X theirs --allow-unrelated-histories --no-edit; then
            git status --porcelain | awk '$1=="DU" || $1=="UD" {print $2}' | xargs -r git rm -f
            git checkout --theirs . || true
            git add -A
            git commit --no-edit || true
          fi

          # Restore our custom workflows and cache
          rm -rf .github/workflows/*
          mkdir -p .github/workflows
          cp -r /tmp/backup/workflows/* .github/workflows/ 2>/dev/null || true
          [ -f "/tmp/backup/security_glossary.json" ] && cp /tmp/backup/security_glossary.json .github/
          [ -f "/tmp/backup/.i18n_cache.json" ] && cp /tmp/backup/.i18n_cache.json .

          # Fetch shared cache from Yaklang
          git clone --depth 1 --branch english-edition "${{ env.YAKLANG_FORK_REPO }}" /tmp/yaklang_fork 2>/dev/null || true
          [ -f "/tmp/yaklang_fork/.i18n_cache.json" ] && cp "/tmp/yaklang_fork/.i18n_cache.json" /tmp/yaklang_cache.json
          rm -rf /tmp/yaklang_fork

      - name: "3. Setup Node.js & TypeScript Compiler"
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g typescript

      - name: "4. Setup Python & Libraries"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --upgrade pip deep-translator PyYAML

      - name: "5. Progressive Translation & Source File Override"
        id: translate
        run: |
          python3 - << 'EOF'
          import os, re, json, time
          from deep_translator import GoogleTranslator

          CACHE_FILE = ".i18n_cache.json"
          GLOSSARY_FILE = ".github/security_glossary.json"
          START_TIME = time.time()
          MAX_RUNTIME_SECONDS = 45 * 60
          MAX_CONSECUTIVE_FAILURES = 5

          translator = GoogleTranslator(source='zh-CN', target='en')
          zh_char_re = re.compile(r'[\u4e00-\u9fff]')
          placeholder_re = re.compile(r'(\{\{.*?\}\}|\$\{[^}]+\}|\{\d+\}|%[+#0 -]*\d*(?:\.\d+)?[svTtbcdoqxXUeEfFgGp%]|\\[nrt"\\])')
          IGNORE_STRINGS = {"微软雅黑", "宋体", "黑体", "苹方", "楷体", "仿宋"}

          def has_zh(text): return bool(zh_char_re.search(str(text)))

          def safe_load_json(filepath):
              if not os.path.exists(filepath): return {}
              try:
                  with open(filepath, 'r', encoding='utf-8') as f: raw = f.read()
                  return json.loads(raw)
              except:
                  try:
                      cleaned = re.sub(r',\s*([}\]])', r'\1', raw)
                      return json.loads(cleaned)
                  except: return {}

          exact_glossary, inline_glossary = {}, {}
          g_data = safe_load_json(GLOSSARY_FILE)
          for _, mapping in g_data.get("terms", {}).items():
              if isinstance(mapping, dict):
                  exact_glossary.update(mapping)
                  inline_glossary.update(mapping)
          sorted_inline_keys = sorted(inline_glossary.keys(), key=len, reverse=True)

          cache = {}
          for cf in ("/tmp/yaklang_cache.json", CACHE_FILE):
              cache.update(safe_load_json(cf))

          def save_cache():
              with open(CACHE_FILE, 'w', encoding='utf-8') as f:
                  json.dump(cache, f, ensure_ascii=False, indent=2)

          def translate_one(orig):
              stripped = orig.strip()
              if stripped in exact_glossary: return exact_glossary[stripped]
              tokens = []
              def mask_fn(m):
                  tokens.append(m.group(0))
                  return f"__PH{len(tokens)-1}__"
              masked = placeholder_re.sub(mask_fn, orig)
              for zh_k in sorted_inline_keys:
                  if zh_k in masked: masked = masked.replace(zh_k, f" {inline_glossary[zh_k]} ")
              if has_zh(masked): masked = translator.translate(masked) or masked
              for idx, tok in enumerate(tokens):
                  masked = re.sub(rf'__PH{idx}__', lambda _: tok, masked, flags=re.IGNORECASE)
              return re.sub(r' {2,}', ' ', masked).strip()

          TOKEN_RE = re.compile(
              r'(//[^\n]*|/\*[\s\S]*?\*/)'
              r'|(`[^`]*`)'
              r'|("(?:\\.|[^"\\\n])*")'
              r"|('(?:\\.|[^'\\\n])*')"
              r'|(>[^<>{}`"\']*?[\u4e00-\u9fff]+[^<>{}`"\']*?<)'
          )

          zh_strings = set()
          source_files = []
          
          # 1. Scan Locales JSON
          ZH_DIR = "app/renderer/src/main/public/locales/zh"
          EN_DIR = "app/renderer/src/main/public/locales/en"
          json_pairs = []
          if os.path.exists(ZH_DIR):
              os.makedirs(EN_DIR, exist_ok=True)
              for fname in os.listdir(ZH_DIR):
                  if fname.endswith(".json"):
                      zh_path, en_path = os.path.join(ZH_DIR, fname), os.path.join(EN_DIR, fname)
                      zh_data, en_data = safe_load_json(zh_path), safe_load_json(en_path)
                      
                      def collect_json_zh(z_obj):
                          if isinstance(z_obj, dict):
                              for k, v in z_obj.items():
                                  if isinstance(v, dict): collect_json_zh(v)
                                  elif isinstance(v, str) and has_zh(v): zh_strings.add(v)
                      collect_json_zh(zh_data)
                      json_pairs.append((en_path, zh_data, en_data))

          # 2. Scan TS/TSX Source Files
          for root, dirs, files in os.walk("app"):
              dirs[:] = [d for d in dirs if d not in {'node_modules', 'dist', 'locales', '__tests__'}]
              for file in files:
                  if file.endswith(('.ts', '.tsx', '.js', '.jsx')) and not file.endswith('.d.ts'):
                      p = os.path.join(root, file)
                      try:
                          with open(p, 'r', encoding='utf-8') as f: c = f.read()
                          if has_zh(c):
                              source_files.append((p, c))
                              is_tsx = file.endswith('.tsx')
                              for m in TOKEN_RE.finditer(c):
                                  comment, special, dq, sq, jsx = m.groups()
                                  if comment: continue
                                  tok = special or dq or sq
                                  if tok and has_zh(tok):
                                      inner = tok[1:-1]
                                      if inner.strip() not in IGNORE_STRINGS: zh_strings.add(inner)
                                  elif is_tsx and jsx and has_zh(jsx):
                                      inner = jsx[1:-1].strip()
                                      if inner and inner not in IGNORE_STRINGS: zh_strings.add(inner)
                      except: pass

          uncached = [s for s in zh_strings if s not in cache or has_zh(cache.get(s, ""))]
          print(f"Total Strings: {len(zh_strings)} | Uncached: {len(uncached)}")

          # Translation Loop
          limit_reached, failures = False, 0
          for idx, s in enumerate(uncached):
              if time.time() - START_TIME > MAX_RUNTIME_SECONDS or failures >= MAX_CONSECUTIVE_FAILURES:
                  limit_reached = True; break
              try:
                  res = translate_one(s)
                  if res and not has_zh(res): cache[s] = res; failures = 0
                  else: failures += 1
              except: failures += 1; time.sleep(1.5)
              if (idx + 1) % 30 == 0: save_cache(); time.sleep(0.4)
          save_cache()

          # =========================================================
          # ACTIVE OVERRIDE: Replace Source Files Immediately!
          # =========================================================
          
          # Override JSON Locales
          def apply_json_zh(z_obj, e_obj):
              changed = False
              if not isinstance(z_obj, dict): return False
              for k, v in z_obj.items():
                  if isinstance(v, dict):
                      if k not in e_obj or not isinstance(e_obj[k], dict): e_obj[k] = {}; changed = True
                      if apply_json_zh(v, e_obj[k]): changed = True
                  elif isinstance(v, str) and has_zh(v):
                      if v in cache and not has_zh(cache[v]) and e_obj.get(k) != cache[v]:
                          e_obj[k] = cache[v]
                          changed = True
              return changed

          for en_path, zh_data, en_data in json_pairs:
              if apply_json_zh(zh_data, en_data):
                  with open(en_path, 'w', encoding='utf-8') as f:
                      json.dump(en_data, f, ensure_ascii=False, indent=2)

          # Override TS/TSX Files
          def sanitize_for_quote(text, quote_char):
              text = text.replace('\r', ' ').replace('\n', ' ')
              if quote_char == "'": text = text.replace("\\'", "'").replace("'", "\\'")
              elif quote_char == '"': text = text.replace('\\"', '"').replace('"', '\\"')
              elif quote_char == '`': text = text.replace('`', "'").replace('${', '\\${')
              return text

          for p, c in source_files:
              try:
                  is_tsx = p.endswith('.tsx')
                  def repl(m):
                      comment, special, dq, sq, jsx = m.groups()
                      if comment: return comment
                      tok = special or dq or sq
                      if tok:
                          if not has_zh(tok): return tok
                          q, inner = tok[0], tok[1:-1]
                          if inner.strip() in IGNORE_STRINGS or inner not in cache or has_zh(cache[inner]): return tok
                          return f"{q}{sanitize_for_quote(cache[inner], q)}{q}"
                      if is_tsx and jsx:
                          inner_raw = jsx[1:-1]
                          inner_stripped = inner_raw.strip()
                          if not inner_stripped or inner_stripped not in cache or has_zh(cache[inner_stripped]): return jsx
                          trans = cache[inner_stripped].replace('<', '&lt;').replace('>', '&gt;')
                          lead = inner_raw[:len(inner_raw) - len(inner_raw.lstrip())]
                          trail = inner_raw[len(inner_raw.rstrip()):]
                          return f">{lead}{trans}{trail}<"
                      return m.group(0)
                  
                  nc = TOKEN_RE.sub(repl, c)
                  if nc != c:
                      with open(p, 'w', encoding='utf-8') as f: f.write(nc)
              except: pass

          remaining = [s for s in zh_strings if s not in cache or has_zh(cache.get(s, ""))]
          is_complete = (len(remaining) == 0) and not limit_reached
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"is_complete={'true' if is_complete else 'false'}\n")
              f.write(f"remaining_count={len(remaining)}\n")
          EOF

      - name: "6. Syntax Check & Auto-Revert"
        run: |
          node - << 'EOF'
          const fs = require("fs");
          const { execFileSync } = require("child_process");
          let ts;
          try { ts = require("typescript"); } catch(e) { process.exit(0); }
          
          function walk(dir, list = []) {
            if (!fs.existsSync(dir)) return list;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === "node_modules" || entry.name === "dist") continue;
              const full = dir + "/" + entry.name;
              if (entry.isDirectory()) walk(full, list);
              else if (entry.name.endsWith(".ts") || entry.name.endsWith(".tsx")) list.push(full);
            }
            return list;
          }
          
          const files = walk("app");
          for (const f of files) {
            try {
              const content = fs.readFileSync(f, "utf8");
              const isTsx = f.endsWith(".tsx");
              const sf = ts.createSourceFile(f, content, 99, true, isTsx ? 4 : 3);
              if (sf.parseDiagnostics && sf.parseDiagnostics.length > 0) {
                console.log(`Reverting syntax error in: ${f}`);
                execFileSync("git", ["checkout", "HEAD", "--", f]);
              }
            } catch(e) {}
          }
          EOF

      - name: "7. Commit Progress to Source Code"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # ဤနေရာတွင် Cache သာမက Override လုပ်ထားသော .ts, .tsx, .json ဖိုင်များကိုပါ Repo ထဲသို့ Commit လုပ်ပါမည်
          git add -A
          if ! git diff --cached --quiet; then
            if [ "${{ steps.translate.outputs.is_complete }}" == "true" ]; then
              git commit -m "feat(i18n): 100% translated source files to English"
            else
              git commit -m "chore(i18n): progressive source code override (${{ steps.translate.outputs.remaining_count }} strings left) [skip ci]"
            fi
            git push origin HEAD:refs/heads/${{ env.TARGET_BRANCH }} --force
          fi

          # 100% ပြီးမှသာ Release ကို အလိုအလျောက် ထုတ်ပါမည်
          if [ "${{ steps.translate.outputs.is_complete }}" == "true" ] || [ "${{ inputs.force_release }}" == "true" ]; then
            VERSION="$(jq -r .version package.json 2>/dev/null || echo '1.4.9')"
            EN_TAG="v${VERSION}-$(date +'%Y%m%d')-en"
            git tag -f "${EN_TAG}" HEAD
            git push origin "refs/tags/${EN_TAG}" --force
            gh workflow run release-en.yml --ref "${{ env.TARGET_BRANCH }}" -f tag_name="${EN_TAG}" || true
          fi
